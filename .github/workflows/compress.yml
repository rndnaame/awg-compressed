name: Compress AWG + sing-box

on:
  schedule:
    - cron: "0 */8 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compress:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y upx-ucl curl wget jq

      - name: Check versions and compress if needed
        id: build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          MIRROR="http://repo.hoaxisr.ru"
          OUR_REPO="${{ github.repository }}"
          TAG="compressed"
          OUT="out"
          mkdir -p "$OUT" work

          upx_fast() {
            f="$1"
            echo "  UPX: $(basename "$f") ($(du -h "$f" | awk '{print $1}')) ..."
            if timeout 240 upx -9 --lzma --force "$f" 2>&1; then
              echo "  OK lzma: $(du -h "$f" | awk '{print $1}')"
              return 0
            fi
            echo "  lzma timeout/fail → пробуем -9"
            if timeout 120 upx -9 --force "$f" 2>&1; then
              echo "  OK -9: $(du -h "$f" | awk '{print $1}')"
              return 0
            fi
            echo "  UPX не успел — оставляем без сжатия"
            return 0
          }

          echo "== Версии на зеркале =="
          : > /tmp/wanted.txt
          : > /tmp/wanted_src.txt

          # IPK → ожидаемые имена *_compressed.ipk
          for pair in "aarch64-k3.10|aarch64-3.10-kn" "mipsel-k3.4|mipsel-3.4-kn" "mips-k3.4|mips-3.4-kn"; do
            path="${pair%%|*}"
            suffix="${pair##*|}"
            ipk=$(curl -sL "$MIRROR/$path/" | grep -oE "awg-manager_[0-9][^\"'<> ]+_${suffix}\\.ipk" | sort -V | tail -1 || true)
            if [ -z "$ipk" ]; then
              echo "  skip mirror $path"
              continue
            fi
            want="${ipk%.ipk}_compressed.ipk"
            echo "  IPK mirror: $ipk → $want"
            echo "$want" >> /tmp/wanted.txt
            echo "ipk|$path|$ipk|$want" >> /tmp/wanted_src.txt
          done

          # sing-box
          sb_ver=$(curl -sL "$MIRROR/singbox/" | grep -oE 'href="1\.[^"/]+/"' | sed 's/href="//;s|/"||' | sort -V | tail -1 || true)
          echo "  sing-box mirror: ${sb_ver:-none}"
          if [ -n "$sb_ver" ]; then
            for f in $(curl -sL "$MIRROR/singbox/$sb_ver/" | grep -oE 'singbox-[^"<> ]+' | grep -v sha256 | grep -E 'aarch64|mips' | sort -u); do
              want="${f}_compressed"
              echo "  SB mirror: $f → $want"
              echo "$want" >> /tmp/wanted.txt
              echo "sb|$sb_ver|$f|$want" >> /tmp/wanted_src.txt
            done
          fi

          sort -u /tmp/wanted.txt -o /tmp/wanted.txt
          echo ""
          echo "== Уже в релизе $OUR_REPO @ $TAG =="
          : > /tmp/existing.txt
          # API своего репо (с токеном — без rate limit)
          API_JSON=$(curl -sL -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${OUR_REPO}/releases/tags/${TAG}" || true)

          if echo "$API_JSON" | grep -q '"assets"'; then
            echo "$API_JSON" | jq -r '.assets[].name // empty' 2>/dev/null >> /tmp/existing.txt || \
            echo "$API_JSON" | grep -oE '"name":\s*"[^"]+"' | sed 's/.*"\([^"]*\)"/\1/' >> /tmp/existing.txt
          else
            echo "  (релиза ещё нет или пустой ответ API)"
          fi
          sort -u /tmp/existing.txt -o /tmp/existing.txt
          if [ -s /tmp/existing.txt ]; then
            sed 's/^/  /' /tmp/existing.txt
          else
            echo "  — пусто"
          fi

          echo ""
          echo "== Что нужно собрать =="
          : > /tmp/todo.txt
          while read -r want; do
            [ -n "$want" ] || continue
            if grep -qxF "$want" /tmp/existing.txt 2>/dev/null; then
              echo "  ✓ уже есть: $want"
            else
              echo "  ✗ нет: $want"
              echo "$want" >> /tmp/todo.txt
            fi
          done < /tmp/wanted.txt

          if [ ! -s /tmp/todo.txt ]; then
            echo ""
            echo "Все актуальные версии уже в релизе — сжатие не требуется."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo ""
          echo "== Сборка недостающего =="

          while IFS='|' read -r kind a b want; do
            [ -n "$want" ] || continue
            grep -qxF "$want" /tmp/todo.txt 2>/dev/null || continue

            if [ "$kind" = "ipk" ]; then
              path="$a"
              ipk="$b"
              echo "IPK: $ipk"
              wget -q -O "work/$ipk" "$MIRROR/$path/$ipk"
              rm -rf work/repack
              mkdir -p work/repack/control work/repack/data
              (
                cd work/repack
                tar -xzf "../$ipk"
                tar -xzf control.tar.gz -C control 2>/dev/null || true
                tar -xzf data.tar.gz -C data 2>/dev/null || true
                find data -type f -executable 2>/dev/null | while read -r f; do
                  head2=$(head -c 2 "$f" 2>/dev/null || true)
                  if [ "$head2" = "#!" ]; then
                    continue
                  fi
                  timeout 120 upx -9 --lzma "$f" 2>/dev/null || timeout 60 upx -9 "$f" 2>/dev/null || true
                done
                tar -czf control.tar.gz -C control .
                tar -czf data.tar.gz -C data .
                echo "2.0" > debian-binary
                tar -czf "../../$OUT/$want" debian-binary control.tar.gz data.tar.gz
              )
              echo "  → $OUT/$want"
            elif [ "$kind" = "sb" ]; then
              sb_ver="$a"
              f="$b"
              echo "sing-box: $f"
              wget -q -O "work/$f" "$MIRROR/singbox/$sb_ver/$f"
              cp "work/$f" "$OUT/$want"
              chmod +x "$OUT/$want"
              upx_fast "$OUT/$want"
              echo "  → $OUT/$want"
            fi
          done < /tmp/wanted_src.txt

          echo ""
          echo "== result =="
          ls -lh "$OUT"
          # если вдруг пусто — не публикуем
          if ! ls "$OUT"/* >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish release
        if: steps.build.outputs.skip != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: compressed
          name: Compressed AWG + sing-box
          body: |
            Auto-built UPX-compressed packages.
            Sources: repo.hoaxisr.ru / hoaxisr/amnezia-box

            ## Установка на роутере

            ```sh
            curl -sL https://raw.githubusercontent.com/rndnaame/awg-compressed/main/install-compressed.sh | sh
            ```

            Меню: только awg-manager / только sing-box / оба.
            Если уже установлено — спросит, обновлять ли.

            Без вопросов:
            ```sh
            INSTALL_AWG=1 INSTALL_SB=0 sh -c "$(curl -sL https://raw.githubusercontent.com/rndnaame/awg-compressed/main/install-compressed.sh)"
            INSTALL_AWG=0 INSTALL_SB=1 sh -c "$(curl -sL https://raw.githubusercontent.com/rndnaame/awg-compressed/main/install-compressed.sh)"
            ```
          files: out/*
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
