name: Compress AWG + sing-box

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compress:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      # UPX ставим только если есть что сжимать (см. ниже в build).
      - name: Check versions and compress if needed
        id: build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          MIRROR="http://repo.hoaxisr.ru"
          OUR_REPO="${{ github.repository }}"
          ROLLING_TAG="upx"
          mkdir -p out/awg out/sb work

          {
            echo "skip=true"
            echo "skip_awg=true"
            echo "skip_sb=true"
            echo "refresh_latest=false"
            echo "awg_ver="
            echo "sb_ver="
            echo "awg_tag="
            echo "sb_tag="
            echo "awg_name="
            echo "sb_name="
            echo "rolling_name=Latest"
          } >> "$GITHUB_OUTPUT"

          upx_fast() {
            f="$1"
            echo "  UPX: $(basename "$f") ($(du -h "$f" | awk '{print $1}')) ..."
            if timeout 240 upx -9 --lzma --force "$f" 2>&1; then
              echo "  OK lzma: $(du -h "$f" | awk '{print $1}')"
              return 0
            fi
            echo "  lzma timeout/fail → пробуем -9"
            if timeout 120 upx -9 --force "$f" 2>&1; then
              echo "  OK -9: $(du -h "$f" | awk '{print $1}')"
              return 0
            fi
            echo "  UPX не успел — оставляем без сжатия"
            return 0
          }

          echo "== Версии на зеркале / GitHub =="
          : > /tmp/wanted.txt
          : > /tmp/wanted_src.txt
          AWG_VER=""
          SB_VER=""
          curl_m() { curl -sL --connect-timeout 15 --max-time 45 "$@"; }

          # 1) Зеркало (с таймаутом — иначе зависает)
          for pair in "aarch64-k3.10|aarch64-3.10-kn" "mipsel-k3.4|mipsel-3.4-kn" "mips-k3.4|mips-3.4-kn"; do
            path="${pair%%|*}"
            suffix="${pair##*|}"
            ipk=$(curl_m "$MIRROR/$path/" | grep -oE "awg-manager_[0-9][^\"'<> ]+_${suffix}\\.ipk" | sort -V | tail -1 || true)
            if [ -z "$ipk" ]; then
              echo "  mirror $path: пусто/таймаут"
              continue
            fi
            want="${ipk%.ipk}_compressed.ipk"
            echo "  IPK (mirror): $ipk => $want"
            echo "$want" >> /tmp/wanted.txt
            echo "ipk|mirror|$path|$ipk|$want" >> /tmp/wanted_src.txt
            v=$(echo "$ipk" | sed -n 's/^awg-manager_\([^_]*\)_.*/\1/p')
            [ -n "$v" ] && AWG_VER="$v"
          done
          MIRROR_AWG_VER="$AWG_VER"
          echo "  AWG с зеркала: ${MIRROR_AWG_VER:-none}"

          # 2) GitHub releases hoaxisr/awg-manager — не ждём зеркало
          # Берём последний tag vN.N.N (не draft); prerelease пропускаем, если есть stable
          GH_AWG_VER=$(
            curl_m -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/hoaxisr/awg-manager/releases?per_page=20" \
            | jq -r '.[] | select(.draft==false) | .tag_name' \
            | sed 's/^v//' | grep -E '^[0-9]' | sort -V | tail -1 || true
          )
          echo "  AWG с GitHub: ${GH_AWG_VER:-none}"

          # Выбираем max(mirror, github)
          if [ -n "$GH_AWG_VER" ]; then
            if [ -z "$AWG_VER" ] || [ "$(printf '%s\n%s\n' "$AWG_VER" "$GH_AWG_VER" | sort -V | tail -1)" = "$GH_AWG_VER" ]; then
              if [ "$GH_AWG_VER" != "$AWG_VER" ]; then
                echo "  → берём GitHub $GH_AWG_VER (новее зеркала ${AWG_VER:-—})"
                AWG_VER="$GH_AWG_VER"
                : > /tmp/wanted.txt
                : > /tmp/wanted_src.txt
                for pair in "aarch64-k3.10|aarch64-3.10-kn" "mipsel-k3.4|mipsel-3.4-kn" "mips-k3.4|mips-3.4-kn"; do
                  path="${pair%%|*}"
                  suffix="${pair##*|}"
                  ipk="awg-manager_${AWG_VER}_${suffix}.ipk"
                  want="${ipk%.ipk}_compressed.ipk"
                  echo "  IPK (github): $ipk => $want"
                  echo "$want" >> /tmp/wanted.txt
                  echo "ipk|github|$path|$ipk|$want" >> /tmp/wanted_src.txt
                done
              fi
            fi
          fi

          # Номер сборки: "41" → 41, "...awgm.40" → 40 (схема awgm-box-N-ARCH)
          sb_build_num() {
            _v="$1"
            case "$_v" in
              *awgm.*)
                echo "$_v" | sed -n 's/.*awgm\.\([0-9][0-9]*\).*/\1/p'
                ;;
              ''|*[!0-9]*)
                echo 0
                ;;
              *)
                # чистое число: тег 41
                echo "$_v"
                ;;
            esac
          }

          # 1) зеркало: 1.15…/ и 41/
          SB_VER_MIRROR=$(
            curl_m "$MIRROR/singbox/" \
              | grep -oE 'href="[^"/]+/"' \
              | sed 's/href="//;s|/"||' \
              | grep -vE '^\.\.?$' \
              | while read -r ver; do
                  n=$(sb_build_num "$ver")
                  n=${n:-0}
                  [ "$n" -gt 0 ] 2>/dev/null || continue
                  printf '%s %s\n' "$n" "$ver"
                done | sort -n | tail -1 | awk '{print $2}'
          )
          echo "  SB зеркало: ${SB_VER_MIRROR:-none} (build=$(sb_build_num "${SB_VER_MIRROR:-}"))"

          # 2) GitHub hoaxisr/awgm-box (теги 41 и legacy 1.15…-awgm.N)
          SB_VER_GH=$(
            curl_m -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/hoaxisr/awgm-box/releases?per_page=20" \
            | jq -r '.[] | select(.draft==false) | .tag_name' \
            | while read -r ver; do
                n=$(sb_build_num "$ver")
                n=${n:-0}
                [ "$n" -gt 0 ] 2>/dev/null || continue
                printf '%s %s\n' "$n" "$ver"
              done | sort -n | tail -1 | awk '{print $2}'
          )
          echo "  SB GitHub (awgm-box): ${SB_VER_GH:-none} (build=$(sb_build_num "${SB_VER_GH:-}"))"

          SB_SRC="mirror"
          SB_VER=""
          _nm=$(sb_build_num "$SB_VER_MIRROR"); _nm=${_nm:-0}
          _ng=$(sb_build_num "$SB_VER_GH"); _ng=${_ng:-0}
          if [ "$_ng" -gt "$_nm" ] 2>/dev/null; then
            SB_VER="$SB_VER_GH"
            SB_SRC="github"
            echo "  → берём GitHub $SB_VER (build $_ng > mirror $_nm)"
          elif [ "$_nm" -gt "$_ng" ] 2>/dev/null && [ -n "$SB_VER_MIRROR" ]; then
            SB_VER="$SB_VER_MIRROR"
            SB_SRC="mirror"
            echo "  → берём зеркало $SB_VER (build $_nm >= github $_ng)"
          elif [ -n "$SB_VER_GH" ]; then
            # равные build или зеркало пусто — GitHub (актуальные имена awgm-box-*)
            SB_VER="$SB_VER_GH"
            SB_SRC="github"
            echo "  → берём GitHub $SB_VER"
          elif [ -n "$SB_VER_MIRROR" ]; then
            SB_VER="$SB_VER_MIRROR"
            SB_SRC="mirror"
          fi
          echo "  sing-box: ${SB_VER:-none} (src=$SB_SRC build=$(sb_build_num "${SB_VER:-}"))"

          if [ -n "$SB_VER" ]; then
            SB_FILES=""
            if [ "$SB_SRC" = "mirror" ]; then
              SB_FILES=$(
                curl_m "$MIRROR/singbox/$SB_VER/" \
                  | grep -oE 'href="(singbox|awgm-box)-[^"]+"' \
                  | sed 's/^href="//;s/"$//' \
                  | grep -vE -- '\.(sha256|sig|asc)$' \
                  | grep -E -- '-(aarch64-3\.10|mipsel-3\.4|mips-3\.4)$' \
                  | sort -u
              )
            fi
            if [ -z "$SB_FILES" ]; then
              SB_SRC="github"
              SB_FILES=$(
                curl_m -H "Authorization: Bearer ${GITHUB_TOKEN}" \
                  -H "Accept: application/vnd.github+json" \
                  "https://api.github.com/repos/hoaxisr/awgm-box/releases/tags/${SB_VER}" \
                | jq -r '.assets[].name // empty' \
                | grep -E -- '^(singbox|awgm-box)-.*-(aarch64-3\.10|mipsel-3\.4|mips-3\.4)$' \
                | grep -vE -- '\.(sha256|sig|asc)$' \
                | sort -u
              )
            fi
            for f in $SB_FILES; do
              want="${f}_compressed"
              echo "  SB ($SB_SRC): $f => $want"
              echo "$want" >> /tmp/wanted.txt
              echo "sb|$SB_SRC|$SB_VER|$f|$want" >> /tmp/wanted_src.txt
            done
            if ! grep -qE '^(singbox|awgm-box)-' /tmp/wanted.txt 2>/dev/null; then
              echo "  ⚠ список SB пуст — проверьте mirror/singbox/$SB_VER/ и hoaxisr/awgm-box tag $SB_VER"
            fi
          fi

          sort -u /tmp/wanted.txt -o /tmp/wanted.txt
          cp /tmp/wanted.txt wanted.txt

          AWG_TAG=""
          SB_TAG=""
          AWG_NAME=""
          SB_NAME=""
          if [ -n "$AWG_VER" ]; then
            AWG_NAME="v${AWG_VER} (AWG-M UPX)"
            AWG_TAG=$(echo "awgm-${AWG_VER}" | sed 's/[^a-zA-Z0-9._-]/-/g')
          fi
          if [ -n "$SB_VER" ]; then
            SB_NAME="sing-box ${SB_VER} (UPX)"
            SB_TAG=$(echo "sb-${SB_VER}" | sed 's/[^a-zA-Z0-9._-]/-/g')
          fi
          # Имя rolling-релиза всегда короткое; версии — в body
          ROLLING_NAME="Latest"

          echo "awg_ver=$AWG_VER" >> "$GITHUB_OUTPUT"
          echo "sb_ver=$SB_VER" >> "$GITHUB_OUTPUT"
          echo "awg_tag=$AWG_TAG" >> "$GITHUB_OUTPUT"
          echo "sb_tag=$SB_TAG" >> "$GITHUB_OUTPUT"
          echo "awg_name=$AWG_NAME" >> "$GITHUB_OUTPUT"
          echo "sb_name=$SB_NAME" >> "$GITHUB_OUTPUT"
          echo "rolling_name=$ROLLING_NAME" >> "$GITHUB_OUTPUT"

          echo ""
          echo "== Ассеты rolling «${ROLLING_TAG}» (только latest) =="
          : > /tmp/existing.txt
          API_JSON=$(curl -sL \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${OUR_REPO}/releases/tags/${ROLLING_TAG}" || true)
          if echo "$API_JSON" | jq -e '.assets' >/dev/null 2>&1; then
            echo "$API_JSON" | jq -r '.assets[].name' >> /tmp/existing.txt
          else
            HTML=$(curl -sL "https://github.com/${OUR_REPO}/releases/expanded_assets/${ROLLING_TAG}" || true)
            echo "$HTML" | grep -oE 'releases/download/[^"]+' | sed 's|.*/||' >> /tmp/existing.txt || true
          fi
          grep -v '^$' /tmp/existing.txt | sort -u > /tmp/e2 && mv /tmp/e2 /tmp/existing.txt
          sed 's/^/  • /' /tmp/existing.txt 2>/dev/null || echo "  (пусто)"

          : > /tmp/todo.txt
          NEED=0
          NEED_AWG=0
          NEED_SB=0
          while read -r want; do
            [ -n "$want" ] || continue
            if grep -qxF "$want" /tmp/existing.txt; then
              echo "  SKIP: $want"
            else
              echo "  BUILD: $want"
              echo "$want" >> /tmp/todo.txt
              NEED=1
              case "$want" in
                awg-manager_*) NEED_AWG=1 ;;
                singbox-*|awgm-box-*) NEED_SB=1 ;;
              esac
            fi
          done < /tmp/wanted.txt

          # Если в rolling-релизе нет ни одного sing-box, а на зеркале есть —
          # принудительно собрать (после сбоя не зацикливаться на refresh-only)
          if ! grep -qE '^(singbox|awgm-box)-' /tmp/existing.txt 2>/dev/null; then
            if grep -qE '^(singbox|awgm-box)-' /tmp/wanted.txt 2>/dev/null; then
              echo ">>> В ${ROLLING_TAG} нет sing-box — принудительная сборка"
              while read -r want; do
                case "$want" in
                  singbox-*|awgm-box-*)
                    if ! grep -qxF "$want" /tmp/todo.txt 2>/dev/null; then
                      echo "  BUILD(force): $want"
                      echo "$want" >> /tmp/todo.txt
                    fi
                    NEED=1
                    NEED_SB=1
                    ;;
                esac
              done < /tmp/wanted.txt
            else
              echo ">>> В ${ROLLING_TAG} нет sing-box, и зеркало не отдало список — проверьте MIRROR/singbox/"
            fi
          fi

          # Официальный changelog: только body upstream (без лишнего текста)
          fetch_official_cl() {
            _repo="$1"
            _tag="$2"
            _title="$3"
            _url="https://github.com/${_repo}/releases/tag/${_tag}"
            _json=$(curl -sL \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${_repo}/releases/tags/${_tag}" || true)
            _body=$(echo "$_json" | jq -r '.body // empty' 2>/dev/null || true)
            # fallback без токена (иногда GITHUB_TOKEN режет чужие private rate)
            if [ -z "$_body" ] || [ "$_body" = "null" ]; then
              _json=$(curl -sL \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/${_repo}/releases/tags/${_tag}" || true)
              _body=$(echo "$_json" | jq -r '.body // empty' 2>/dev/null || true)
            fi
            if [ -n "$_body" ] && [ "$_body" != "null" ]; then
              echo "$_body"
              echo ""
              echo "— Источник: ${_url}"
            else
              echo "Официальный changelog: ${_url}"
            fi
          }

          # Топик-релизы: только официальный changelog
          {
            if [ -n "$AWG_VER" ]; then
              fetch_official_cl "hoaxisr/awg-manager" "v${AWG_VER}" "awg-manager v${AWG_VER}"
            else
              echo ""
            fi
          } > release-body-awg.md

          {
            if [ -n "$SB_VER" ]; then
              fetch_official_cl "hoaxisr/awgm-box" "${SB_VER}" "sing-box ${SB_VER}"
            else
              echo ""
            fi
          } > release-body-sb.md

          {
            echo "Крайние UPX-версии:"
            echo ""
            [ -n "$AWG_VER" ] && echo "- awg-manager: **v${AWG_VER}**"
            [ -n "$SB_VER" ] && echo "- sing-box: **${SB_VER}**"
            echo ""
            if [ -n "$AWG_VER" ]; then
              echo "### Changelog awg-manager v${AWG_VER}"
              echo ""
              fetch_official_cl "hoaxisr/awg-manager" "v${AWG_VER}" "awg-manager v${AWG_VER}"
              echo ""
            fi
            if [ -n "$SB_VER" ]; then
              echo "### Changelog sing-box ${SB_VER}"
              echo ""
              fetch_official_cl "hoaxisr/awgm-box" "${SB_VER}" "sing-box ${SB_VER}"
            fi
          } > release-body-rolling.md

          if [ "$NEED" -eq 0 ]; then
            echo ">>> Сжимать нечего (файлы уже в ${ROLLING_TAG}) — релиз не трогаем"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "refresh_latest=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "refresh_latest=false" >> "$GITHUB_OUTPUT"

          echo "skip=false" >> "$GITHUB_OUTPUT"
          [ "$NEED_AWG" -eq 1 ] && echo "skip_awg=false" >> "$GITHUB_OUTPUT"
          [ "$NEED_SB" -eq 1 ] && echo "skip_sb=false" >> "$GITHUB_OUTPUT"

          echo ""
          echo "== Установка UPX (нужна только для сборки) =="
          UPX_VER=4.2.2
          curl -fsSL "https://github.com/upx/upx/releases/download/v${UPX_VER}/upx-${UPX_VER}-amd64_linux.tar.xz" \
            | sudo tar -xJ --strip-components=1 -C /usr/local/bin "upx-${UPX_VER}-amd64_linux/upx"
          sudo chmod +x /usr/local/bin/upx
          upx --version

          echo ""
          echo "== Сборка недостающего =="
          while IFS='|' read -r kind a b c d; do
            if [ "$kind" = "ipk" ]; then
              src="$a"; path="$b"; ipk="$c"; want="$d"
            elif [ "$kind" = "sb" ]; then
              # sb|src|ver|file|want  (новый) или sb|ver|file|want (старый)
              if [ -n "$d" ]; then
                sb_src="$a"; sb_ver_field="$b"; f="$c"; want="$d"
              else
                sb_src="mirror"; sb_ver_field="$a"; f="$b"; want="$c"
              fi
            else
              continue
            fi
            [ -n "$want" ] || continue
            grep -qxF "$want" /tmp/todo.txt || continue

            if [ "$kind" = "ipk" ]; then
              echo "IPK: $ipk (src=$src)"
              rm -f "work/$ipk"
              ok=0
              if [ "$src" != "github" ]; then
                if wget -q -O "work/$ipk" "$MIRROR/$path/$ipk" && [ -s "work/$ipk" ]; then
                  ok=1
                else
                  echo "  mirror fail → GitHub"
                fi
              fi
              if [ "$ok" != "1" ]; then
                _ver=$(echo "$ipk" | sed -n 's/^awg-manager_\([^_]*\)_.*/\1/p')
                if ! wget -q -O "work/$ipk" \
                  "https://github.com/hoaxisr/awg-manager/releases/download/v${_ver}/$ipk"; then
                  echo "ERROR: download failed $ipk"
                  continue
                fi
              fi
              rm -rf work/repack
              mkdir -p work/repack/control work/repack/data
              (
                cd work/repack
                tar -xzf "../$ipk"
                tar -xzf control.tar.gz -C control 2>/dev/null || true
                tar -xzf data.tar.gz -C data 2>/dev/null || true
                find data -type f -executable 2>/dev/null | while read -r f; do
                  head2=$(head -c 2 "$f" 2>/dev/null || true)
                  [ "$head2" = "#!" ] && continue
                  timeout 120 upx -9 --lzma "$f" 2>/dev/null || timeout 60 upx -9 "$f" 2>/dev/null || true
                done
                tar -czf control.tar.gz -C control .
                tar -czf data.tar.gz -C data .
                echo "2.0" > debian-binary
                tar -czf "../../out/awg/$want" debian-binary control.tar.gz data.tar.gz
              )
              cp "out/awg/$want" "out/$want"
              ls -lh "out/awg/$want"
            elif [ "$kind" = "sb" ]; then
              sb_ver="$sb_ver_field"
              # защита от мусорных имён (обрезанный HTML, .sha256 и т.п.)
              case "$f" in
                *sha256*|*'&'*|*'>'*|*'<'*|*'..'*)
                  echo "SKIP bad SB name: $f"
                  continue
                  ;;
              esac
              case "$f" in
                singbox-*-aarch64-3.10|singbox-*-mipsel-3.4|singbox-*-mips-3.4|awgm-box-*-aarch64-3.10|awgm-box-*-mipsel-3.4|awgm-box-*-mips-3.4) ;;
                *)
                  echo "SKIP unexpected SB name: $f"
                  continue
                  ;;
              esac
              echo "SB: $f (src=${sb_src:-mirror})"
              rm -f "work/$f"
              ok=0
              if [ "${sb_src:-mirror}" != "github" ]; then
                if wget -q -O "work/$f" "$MIRROR/singbox/$sb_ver/$f" && [ -s "work/$f" ]; then
                  ok=1
                else
                  echo "  mirror fail → GitHub awgm-box"
                fi
              fi
              if [ "$ok" != "1" ]; then
                if ! wget -q -O "work/$f" \
                  "https://github.com/hoaxisr/awgm-box/releases/download/${sb_ver}/$f"; then
                  echo "ERROR: download failed mirror+github $f"
                  exit 1
                fi
              fi
              # бинарник должен быть крупным
              _sz=$(wc -c < "work/$f" | tr -d ' ')
              if [ "${_sz:-0}" -lt 1000000 ]; then
                echo "ERROR: $f too small (${_sz} bytes) — не бинарник"
                exit 1
              fi
              cp "work/$f" "out/sb/$want"
              chmod +x "out/sb/$want"
              upx_fast "out/sb/$want"
              cp "out/sb/$want" "out/$want"
              ls -lh "out/sb/$want"
            fi
          done < /tmp/wanted_src.txt

          echo ""
          echo "== Результат сборки =="
          ls -lh out/awg/ out/sb/ out/ 2>/dev/null || true

          # ВАЖНО: проверять каталоги по отдельности.
          # Раньше: ls out/awg/* out/sb/* — если sb пуст, ls падал и выставлял skip=true,
          # хотя AWG уже собран → релизы не публиковались.
          HAS_AWG=0
          HAS_SB=0
          ls out/awg/* >/dev/null 2>&1 && HAS_AWG=1
          ls out/sb/* >/dev/null 2>&1 && HAS_SB=1
          echo "  HAS_AWG=$HAS_AWG HAS_SB=$HAS_SB"

          if [ "$HAS_AWG" -eq 0 ] && [ "$HAS_SB" -eq 0 ]; then
            echo ">>> Нет собранных файлов — публикация отменена"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "skip_awg=true" >> "$GITHUB_OUTPUT"
            echo "skip_sb=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            if [ "$HAS_AWG" -eq 1 ]; then
              echo "skip_awg=false" >> "$GITHUB_OUTPUT"
            else
              echo "skip_awg=true" >> "$GITHUB_OUTPUT"
            fi
            if [ "$HAS_SB" -eq 1 ]; then
              echo "skip_sb=false" >> "$GITHUB_OUTPUT"
            else
              echo "skip_sb=true" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Publish AWG-M topic (архив, навсегда)
        if: steps.build.outputs.skip_awg != 'true' && steps.build.outputs.awg_tag != ''
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.build.outputs.awg_tag }}
          name: ${{ steps.build.outputs.awg_name }}
          body_path: release-body-awg.md
          files: out/awg/*
          fail_on_unmatched_files: false
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish sing-box topic (архив, навсегда)
        if: steps.build.outputs.skip_sb != 'true' && steps.build.outputs.sb_tag != ''
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.build.outputs.sb_tag }}
          name: ${{ steps.build.outputs.sb_name }}
          body_path: release-body-sb.md
          files: out/sb/*
          fail_on_unmatched_files: false
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Полный набор для Latest:
      # 1) ВСЕ текущие ассеты upx (чтобы не потерять sing-box, если AWG собрался один)
      # 2) поверх — свежая сборка (cp -f)
      - name: Prepare full Latest asset set
        if: steps.build.outputs.skip != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          OUR_REPO="${{ github.repository }}"
          TAG="upx"
          rm -rf out/latest
          mkdir -p out/latest

          JSON=$(curl -sL \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${OUR_REPO}/releases/tags/${TAG}" || true)

          if echo "$JSON" | jq -e '.assets | length > 0' >/dev/null 2>&1; then
            echo "== Сохраняем текущие ассеты $TAG =="
            echo "$JSON" | jq -c '.assets[]' | while read -r row; do
              name=$(echo "$row" | jq -r '.name')
              url=$(echo "$row" | jq -r '.browser_download_url')
              [ -n "$name" ] && [ "$name" != "null" ] || continue
              echo "  скачиваем $name"
              curl -sL -o "out/latest/$name" \
                -H "Authorization: Bearer $GITHUB_TOKEN" \
                -H "Accept: application/octet-stream" \
                "$url" || echo "  ⚠ не скачался $name"
            done
          else
            echo "  (старого $TAG нет или без ассетов)"
          fi

          echo "== Накладываем свежую сборку =="
          cp -f out/*.ipk out/latest/ 2>/dev/null || true
          cp -f out/singbox-*_compressed out/latest/ 2>/dev/null || true
          cp -f out/awgm-box-*_compressed out/latest/ 2>/dev/null || true
          cp -f out/awg/* out/latest/ 2>/dev/null || true
          cp -f out/sb/* out/latest/ 2>/dev/null || true

          # Убрать устаревшие версии того же слота, если в wanted есть новая
          # (awg-manager_*_ARCH_*, singbox-*-ARCH_compressed)
          if [ -f wanted.txt ]; then
            while read -r want; do
              [ -n "$want" ] || continue
              [ -f "out/latest/$want" ] || continue
              case "$want" in
                awg-manager_*_aarch64-3.10-kn_compressed.ipk)
                  find out/latest -maxdepth 1 -name 'awg-manager_*_aarch64-3.10-kn_compressed.ipk' ! -name "$want" -delete 2>/dev/null || true
                  ;;
                awg-manager_*_mipsel-3.4-kn_compressed.ipk)
                  find out/latest -maxdepth 1 -name 'awg-manager_*_mipsel-3.4-kn_compressed.ipk' ! -name "$want" -delete 2>/dev/null || true
                  ;;
                awg-manager_*_mips-3.4-kn_compressed.ipk)
                  find out/latest -maxdepth 1 -name 'awg-manager_*_mips-3.4-kn_compressed.ipk' ! -name "$want" -delete 2>/dev/null || true
                  ;;
                singbox-*-aarch64-3.10_compressed|awgm-box-*-aarch64-3.10_compressed)
                  find out/latest -maxdepth 1 \( -name 'singbox-*-aarch64-3.10_compressed' -o -name 'awgm-box-*-aarch64-3.10_compressed' \) ! -name "$want" -delete 2>/dev/null || true
                  ;;
                singbox-*-mipsel-3.4_compressed|awgm-box-*-mipsel-3.4_compressed)
                  find out/latest -maxdepth 1 \( -name 'singbox-*-mipsel-3.4_compressed' -o -name 'awgm-box-*-mipsel-3.4_compressed' \) ! -name "$want" -delete 2>/dev/null || true
                  ;;
                singbox-*-mips-3.4_compressed|awgm-box-*-mips-3.4_compressed)
                  find out/latest -maxdepth 1 \( -name 'singbox-*-mips-3.4_compressed' -o -name 'awgm-box-*-mips-3.4_compressed' \) ! -name "$want" -delete 2>/dev/null || true
                  ;;
              esac
            done < wanted.txt
          fi

          echo "Ассеты для Latest:"
          ls -lh out/latest/ || true
          # не публиковать пустой набор
          count=$(find out/latest -type f | wc -l)
          if [ "$count" -eq 0 ]; then
            echo "ERROR: out/latest пуст — отмена публикации"
            exit 1
          fi

      # Пауза: топик-релизы уже опубликованы; ждём, чтобы created_at у Latest был новее
      # (при одинаковом created_at GitHub может поставить топик выше Latest).
      - name: Wait before Latest (ordering)
        if: steps.build.outputs.skip != 'true'
        run: |
          echo "Ждём 5с, чтобы Latest получил более поздний created_at..."
          sleep 5

      # Удаляем release + git-тег upx.
      # Список релизов GitHub сортирует по created_at; старый тег → Latest в конце.
      - name: Recreate upx (Latest, always on top)
        if: steps.build.outputs.skip != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          OUR_REPO="${{ github.repository }}"
          TAG="upx"
          API="https://api.github.com/repos/${OUR_REPO}"
          auth=(-H "Authorization: Bearer $GITHUB_TOKEN" -H "Accept: application/vnd.github+json")

          # Миграция: старый тег compressed → upx (upx > sb- в сортировке списка)
          for LEGACY in compressed; do
            LJ=$(curl -sL "${auth[@]}" "$API/releases/tags/${LEGACY}" || true)
            LRID=$(echo "$LJ" | jq -r '.id // empty')
            if [ -n "$LRID" ]; then
              echo "Удаляем legacy release $LEGACY (id=$LRID)..."
              curl -sL -X DELETE "${auth[@]}" "$API/releases/${LRID}" || true
            fi
            curl -sL -X DELETE "${auth[@]}" "$API/git/refs/tags/${LEGACY}" || true
          done

          JSON=$(curl -sL "${auth[@]}" "$API/releases/tags/${TAG}" || true)
          RID=$(echo "$JSON" | jq -r '.id // empty')
          if [ -n "$RID" ]; then
            echo "Удаляем release $TAG (id=$RID)..."
            curl -sL -X DELETE "${auth[@]}" "$API/releases/${RID}"
          fi
          echo "Удаляем git-тег refs/tags/${TAG}..."
          curl -sL -X DELETE "${auth[@]}" "$API/git/refs/tags/${TAG}" || true
          sleep 3

      - name: Publish compressed (Latest)
        if: steps.build.outputs.skip != 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: upx
          name: ${{ steps.build.outputs.rolling_name }}
          body_path: release-body-rolling.md
          files: out/latest/*
          fail_on_unmatched_files: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Когда сжимать нечего — всё равно body + make_latest, чтобы Latest оставался сверху
      - name: Refresh Latest body and pin as latest
        if: steps.build.outputs.refresh_latest == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          OUR_REPO="${{ github.repository }}"
          TAG="upx"
          [ -f release-body-rolling.md ] || { echo "no body"; exit 0; }

          JSON=$(curl -sL \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${OUR_REPO}/releases/tags/${TAG}" || true)
          RID=$(echo "$JSON" | jq -r '.id // empty')
          if [ -z "$RID" ]; then
            echo "Релиза $TAG нет — нечего обновлять"
            exit 0
          fi

          # Пересоздаём release с теми же ассетами: delete → create → upload
          # так published_at свежий и Latest снова сверху
          mkdir -p out/latest
          echo "$JSON" | jq -c '.assets[]?' | while read -r row; do
            name=$(echo "$row" | jq -r '.name')
            url=$(echo "$row" | jq -r '.browser_download_url')
            echo "  скачиваем $name"
            curl -sL -o "out/latest/$name" \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Accept: application/octet-stream" \
              "$url" || true
          done

          echo "Ждём 5с перед пересозданием Latest..."
          sleep 5
          echo "Удаляем release $TAG (id=$RID)..."
          curl -sL -X DELETE \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${OUR_REPO}/releases/${RID}"
          echo "Удаляем git-тег refs/tags/${TAG}..."
          curl -sL -X DELETE \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${OUR_REPO}/git/refs/tags/${TAG}" || true
          sleep 3

      - name: Re-publish compressed after refresh
        if: steps.build.outputs.refresh_latest == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: upx
          name: ${{ steps.build.outputs.rolling_name }}
          body_path: release-body-rolling.md
          files: out/latest/*
          fail_on_unmatched_files: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
