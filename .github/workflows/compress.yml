name: Compress AWG + sing-box

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compress:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y upx-ucl curl wget jq

      - name: Check versions and compress if needed
        id: build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          MIRROR="http://repo.hoaxisr.ru"
          OUR_REPO="${{ github.repository }}"
          ROLLING_TAG="compressed"
          mkdir -p out/awg out/sb work

          {
            echo "skip=true"
            echo "skip_awg=true"
            echo "skip_sb=true"
            echo "refresh_latest=false"
            echo "awg_ver="
            echo "sb_ver="
            echo "awg_tag="
            echo "sb_tag="
            echo "awg_name="
            echo "sb_name="
            echo "rolling_name=Latest"
          } >> "$GITHUB_OUTPUT"

          upx_fast() {
            f="$1"
            echo "  UPX: $(basename "$f") ($(du -h "$f" | awk '{print $1}')) ..."
            if timeout 240 upx -9 --lzma --force "$f" 2>&1; then
              echo "  OK lzma: $(du -h "$f" | awk '{print $1}')"
              return 0
            fi
            echo "  lzma timeout/fail → пробуем -9"
            if timeout 120 upx -9 --force "$f" 2>&1; then
              echo "  OK -9: $(du -h "$f" | awk '{print $1}')"
              return 0
            fi
            echo "  UPX не успел — оставляем без сжатия"
            return 0
          }

          echo "== Версии на зеркале =="
          : > /tmp/wanted.txt
          : > /tmp/wanted_src.txt
          AWG_VER=""
          SB_VER=""

          for pair in "aarch64-k3.10|aarch64-3.10-kn" "mipsel-k3.4|mipsel-3.4-kn" "mips-k3.4|mips-3.4-kn"; do
            path="${pair%%|*}"
            suffix="${pair##*|}"
            ipk=$(curl -sL "$MIRROR/$path/" | grep -oE "awg-manager_[0-9][^\"'<> ]+_${suffix}\\.ipk" | sort -V | tail -1 || true)
            if [ -z "$ipk" ]; then
              echo "  skip mirror $path"
              continue
            fi
            want="${ipk%.ipk}_compressed.ipk"
            echo "  IPK: $ipk => $want"
            echo "$want" >> /tmp/wanted.txt
            echo "ipk|$path|$ipk|$want" >> /tmp/wanted_src.txt
            v=$(echo "$ipk" | sed -n 's/^awg-manager_\([^_]*\)_.*/\1/p')
            [ -n "$v" ] && AWG_VER="$v"
          done

          # sort -V: 1.14.0-rc.1-awgm.15 > 1.14.0-awgm.16 — неверно для форка.
          # Берём версию с максимальным N в суффиксе -awgm.N.
          SB_VER=$(
            curl -sL "$MIRROR/singbox/"               | grep -oE 'href="1\.[^"/]+/"'               | sed 's/href="//;s|/"||'               | while read -r ver; do
                  n=$(echo "$ver" | sed -n 's/.*awgm\.\([0-9][0-9]*\).*/\1/p')
                  [ -n "$n" ] || n=0
                  printf '%s %s\n' "$n" "$ver"
                done               | sort -n               | tail -1               | awk '{print $2}'
          )
          echo "  sing-box: ${SB_VER:-none}"
          if [ -n "$SB_VER" ]; then
            for f in $(curl -sL "$MIRROR/singbox/$SB_VER/" | grep -oE 'singbox-[^"<> ]+' | grep -v sha256 | grep -E 'aarch64|mips' | sort -u); do
              want="${f}_compressed"
              echo "  SB: $f => $want"
              echo "$want" >> /tmp/wanted.txt
              echo "sb|$SB_VER|$f|$want" >> /tmp/wanted_src.txt
            done
          fi
          sort -u /tmp/wanted.txt -o /tmp/wanted.txt
          cp /tmp/wanted.txt wanted.txt

          AWG_TAG=""
          SB_TAG=""
          AWG_NAME=""
          SB_NAME=""
          if [ -n "$AWG_VER" ]; then
            AWG_NAME="v${AWG_VER} (AWG-M UPX)"
            AWG_TAG=$(echo "awgm-${AWG_VER}" | sed 's/[^a-zA-Z0-9._-]/-/g')
          fi
          if [ -n "$SB_VER" ]; then
            SB_NAME="${SB_VER} (sing-box UPX)"
            SB_TAG=$(echo "sb-${SB_VER}" | sed 's/[^a-zA-Z0-9._-]/-/g')
          fi
          # Имя rolling-релиза всегда короткое; версии — в body
          ROLLING_NAME="Latest"

          echo "awg_ver=$AWG_VER" >> "$GITHUB_OUTPUT"
          echo "sb_ver=$SB_VER" >> "$GITHUB_OUTPUT"
          echo "awg_tag=$AWG_TAG" >> "$GITHUB_OUTPUT"
          echo "sb_tag=$SB_TAG" >> "$GITHUB_OUTPUT"
          echo "awg_name=$AWG_NAME" >> "$GITHUB_OUTPUT"
          echo "sb_name=$SB_NAME" >> "$GITHUB_OUTPUT"
          echo "rolling_name=$ROLLING_NAME" >> "$GITHUB_OUTPUT"

          echo ""
          echo "== Ассеты rolling «${ROLLING_TAG}» (только latest) =="
          : > /tmp/existing.txt
          API_JSON=$(curl -sL \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${OUR_REPO}/releases/tags/${ROLLING_TAG}" || true)
          if echo "$API_JSON" | jq -e '.assets' >/dev/null 2>&1; then
            echo "$API_JSON" | jq -r '.assets[].name' >> /tmp/existing.txt
          else
            HTML=$(curl -sL "https://github.com/${OUR_REPO}/releases/expanded_assets/${ROLLING_TAG}" || true)
            echo "$HTML" | grep -oE 'releases/download/[^"]+' | sed 's|.*/||' >> /tmp/existing.txt || true
          fi
          grep -v '^$' /tmp/existing.txt | sort -u > /tmp/e2 && mv /tmp/e2 /tmp/existing.txt
          sed 's/^/  • /' /tmp/existing.txt 2>/dev/null || echo "  (пусто)"

          : > /tmp/todo.txt
          NEED=0
          NEED_AWG=0
          NEED_SB=0
          while read -r want; do
            [ -n "$want" ] || continue
            if grep -qxF "$want" /tmp/existing.txt; then
              echo "  SKIP: $want"
            else
              echo "  BUILD: $want"
              echo "$want" >> /tmp/todo.txt
              NEED=1
              case "$want" in
                awg-manager_*) NEED_AWG=1 ;;
                singbox-*) NEED_SB=1 ;;
              esac
            fi
          done < /tmp/wanted.txt

          # Официальный changelog: repo tag → body (или ссылка)
          fetch_official_cl() {
            _repo="$1"
            _tag="$2"
            _title="$3"
            _url="https://github.com/${_repo}/releases/tag/${_tag}"
            _json=$(curl -sL \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${_repo}/releases/tags/${_tag}" || true)
            _body=$(echo "$_json" | jq -r '.body // empty' 2>/dev/null || true)
            echo ""
            echo "<details>"
            echo "<summary>Changelog ${_title} (официальный)</summary>"
            echo ""
            if [ -n "$_body" ] && [ "$_body" != "null" ]; then
              echo "$_body"
              echo ""
              echo "— Источник: ${_url}"
            else
              echo "Не удалось загрузить notes. Смотрите: ${_url}"
            fi
            echo ""
            echo "</details>"
          }

          {
            echo "### ${AWG_NAME:-awg-manager UPX}"
            echo ""
            echo "UPX-сборка awg-manager. Актуальные файлы для установщика — в теге \`${ROLLING_TAG}\`."
            echo ""
            echo '```sh'
            echo "curl -sL https://raw.githubusercontent.com/${OUR_REPO}/main/install-compressed.sh | sh"
            echo '```'
            if [ -n "$AWG_VER" ]; then
              fetch_official_cl "hoaxisr/awg-manager" "v${AWG_VER}" "awg-manager v${AWG_VER}"
            fi
          } > release-body-awg.md

          {
            echo "### ${SB_NAME:-sing-box UPX}"
            echo ""
            echo "UPX-сборка sing-box (amnezia-box). Актуальные файлы для установщика — в теге \`${ROLLING_TAG}\`."
            echo ""
            echo '```sh'
            echo "curl -sL https://raw.githubusercontent.com/${OUR_REPO}/main/install-compressed.sh | sh"
            echo '```'
            if [ -n "$SB_VER" ]; then
              fetch_official_cl "hoaxisr/amnezia-box" "${SB_VER}" "sing-box ${SB_VER}"
            fi
          } > release-body-sb.md

          {
            echo "В этом релизе только **крайние** версии, сжатые UPX."
            echo ""
            [ -n "$AWG_VER" ] && echo "- awg-manager: **v${AWG_VER}** → топик \`${AWG_TAG}\`"
            [ -n "$SB_VER" ] && echo "- sing-box: **${SB_VER}** → топик \`${SB_TAG}\`"
            echo ""
            echo "История версий — в отдельных релизах \`awgm-*\` и \`sb-*\`."
            echo ""
            echo '```sh'
            echo "curl -sL https://raw.githubusercontent.com/${OUR_REPO}/main/install-compressed.sh | sh"
            echo '```'
            if [ -n "$AWG_VER" ]; then
              fetch_official_cl "hoaxisr/awg-manager" "v${AWG_VER}" "awg-manager v${AWG_VER}"
            fi
            if [ -n "$SB_VER" ]; then
              fetch_official_cl "hoaxisr/amnezia-box" "${SB_VER}" "sing-box ${SB_VER}"
            fi
          } > release-body-rolling.md

          if [ "$NEED" -eq 0 ]; then
            echo ">>> Сжимать нечего (файлы уже в ${ROLLING_TAG})"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            # Всё равно обновим body + make_latest, чтобы Latest оставался сверху
            echo "refresh_latest=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "refresh_latest=false" >> "$GITHUB_OUTPUT"

          echo "skip=false" >> "$GITHUB_OUTPUT"
          [ "$NEED_AWG" -eq 1 ] && echo "skip_awg=false" >> "$GITHUB_OUTPUT"
          [ "$NEED_SB" -eq 1 ] && echo "skip_sb=false" >> "$GITHUB_OUTPUT"

          echo ""
          echo "== Сборка недостающего =="
          while IFS='|' read -r kind a b want; do
            [ -n "$want" ] || continue
            grep -qxF "$want" /tmp/todo.txt || continue

            if [ "$kind" = "ipk" ]; then
              path="$a"
              ipk="$b"
              echo "IPK: $ipk"
              wget -q -O "work/$ipk" "$MIRROR/$path/$ipk"
              rm -rf work/repack
              mkdir -p work/repack/control work/repack/data
              (
                cd work/repack
                tar -xzf "../$ipk"
                tar -xzf control.tar.gz -C control 2>/dev/null || true
                tar -xzf data.tar.gz -C data 2>/dev/null || true
                find data -type f -executable 2>/dev/null | while read -r f; do
                  head2=$(head -c 2 "$f" 2>/dev/null || true)
                  [ "$head2" = "#!" ] && continue
                  timeout 120 upx -9 --lzma "$f" 2>/dev/null || timeout 60 upx -9 "$f" 2>/dev/null || true
                done
                tar -czf control.tar.gz -C control .
                tar -czf data.tar.gz -C data .
                echo "2.0" > debian-binary
                tar -czf "../../out/awg/$want" debian-binary control.tar.gz data.tar.gz
              )
              cp "out/awg/$want" "out/$want"
              ls -lh "out/awg/$want"
            elif [ "$kind" = "sb" ]; then
              sb_ver="$a"
              f="$b"
              echo "SB: $f"
              wget -q -O "work/$f" "$MIRROR/singbox/$sb_ver/$f"
              cp "work/$f" "out/sb/$want"
              chmod +x "out/sb/$want"
              upx_fast "out/sb/$want"
              cp "out/sb/$want" "out/$want"
              ls -lh "out/sb/$want"
            fi
          done < /tmp/wanted_src.txt

          echo ""
          echo "== Результат сборки =="
          ls -lh out/awg/ out/sb/ out/ 2>/dev/null || true

          # ВАЖНО: проверять каталоги по отдельности.
          # Раньше: ls out/awg/* out/sb/* — если sb пуст, ls падал и выставлял skip=true,
          # хотя AWG уже собран → релизы не публиковались.
          HAS_AWG=0
          HAS_SB=0
          ls out/awg/* >/dev/null 2>&1 && HAS_AWG=1
          ls out/sb/* >/dev/null 2>&1 && HAS_SB=1
          echo "  HAS_AWG=$HAS_AWG HAS_SB=$HAS_SB"

          if [ "$HAS_AWG" -eq 0 ] && [ "$HAS_SB" -eq 0 ]; then
            echo ">>> Нет собранных файлов — публикация отменена"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "skip_awg=true" >> "$GITHUB_OUTPUT"
            echo "skip_sb=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            if [ "$HAS_AWG" -eq 1 ]; then
              echo "skip_awg=false" >> "$GITHUB_OUTPUT"
            else
              echo "skip_awg=true" >> "$GITHUB_OUTPUT"
            fi
            if [ "$HAS_SB" -eq 1 ]; then
              echo "skip_sb=false" >> "$GITHUB_OUTPUT"
            else
              echo "skip_sb=true" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Publish AWG-M topic (архив, навсегда)
        if: steps.build.outputs.skip_awg != 'true' && steps.build.outputs.awg_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.build.outputs.awg_tag }}
          name: ${{ steps.build.outputs.awg_name }}
          body_path: release-body-awg.md
          files: out/awg/*
          fail_on_unmatched_files: false
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish sing-box topic (архив, навсегда)
        if: steps.build.outputs.skip_sb != 'true' && steps.build.outputs.sb_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.build.outputs.sb_tag }}
          name: ${{ steps.build.outputs.sb_name }}
          body_path: release-body-sb.md
          files: out/sb/*
          fail_on_unmatched_files: false
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Полный набор ассетов для Latest: новые из out/ + недостающие с текущего compressed
      - name: Prepare full Latest asset set
        if: steps.build.outputs.skip != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          OUR_REPO="${{ github.repository }}"
          TAG="compressed"
          mkdir -p out/latest
          # свежесобранное
          cp -n out/*.ipk out/latest/ 2>/dev/null || true
          cp -n out/singbox-*_compressed out/latest/ 2>/dev/null || true
          cp -n out/awg/* out/latest/ 2>/dev/null || true
          cp -n out/sb/* out/latest/ 2>/dev/null || true

          JSON=$(curl -sL \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${OUR_REPO}/releases/tags/${TAG}" || true)

          if [ -f wanted.txt ] && echo "$JSON" | jq -e '.assets' >/dev/null 2>&1; then
            while read -r want; do
              [ -n "$want" ] || continue
              [ -f "out/latest/$want" ] && continue
              url=$(echo "$JSON" | jq -r --arg n "$want" '.assets[] | select(.name==$n) | .browser_download_url' | head -1)
              if [ -n "$url" ] && [ "$url" != "null" ]; then
                echo "  + из старого $TAG: $want"
                curl -sL -o "out/latest/$want" \
                  -H "Authorization: Bearer $GITHUB_TOKEN" \
                  -H "Accept: application/octet-stream" \
                  "$url" || true
              fi
            done < wanted.txt
          fi

          echo "Ассеты для Latest:"
          ls -lh out/latest/ || true

      # Удаляем старый compressed и создаём заново → всегда сверху в списке релизов
      - name: Recreate compressed (Latest, always on top)
        if: steps.build.outputs.skip != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          OUR_REPO="${{ github.repository }}"
          TAG="compressed"
          JSON=$(curl -sL \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${OUR_REPO}/releases/tags/${TAG}" || true)
          RID=$(echo "$JSON" | jq -r '.id // empty')
          if [ -n "$RID" ]; then
            echo "Удаляем старый release $TAG (id=$RID)..."
            curl -sL -X DELETE \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${OUR_REPO}/releases/${RID}"
            # тег может остаться — softprops/gh пересоздаст release на том же теге
            sleep 2
          fi

      - name: Publish compressed (Latest)
        if: steps.build.outputs.skip != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: compressed
          name: ${{ steps.build.outputs.rolling_name }}
          body_path: release-body-rolling.md
          files: out/latest/*
          fail_on_unmatched_files: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Когда сжимать нечего — всё равно body + make_latest, чтобы Latest оставался сверху
      - name: Refresh Latest body and pin as latest
        if: steps.build.outputs.refresh_latest == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          OUR_REPO="${{ github.repository }}"
          TAG="compressed"
          [ -f release-body-rolling.md ] || { echo "no body"; exit 0; }

          JSON=$(curl -sL \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${OUR_REPO}/releases/tags/${TAG}" || true)
          RID=$(echo "$JSON" | jq -r '.id // empty')
          if [ -z "$RID" ]; then
            echo "Релиза $TAG нет — нечего обновлять"
            exit 0
          fi

          # Пересоздаём release с теми же ассетами: delete → create → upload
          # так published_at свежий и Latest снова сверху
          mkdir -p out/latest
          echo "$JSON" | jq -c '.assets[]?' | while read -r row; do
            name=$(echo "$row" | jq -r '.name')
            url=$(echo "$row" | jq -r '.browser_download_url')
            echo "  скачиваем $name"
            curl -sL -o "out/latest/$name" \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Accept: application/octet-stream" \
              "$url" || true
          done

          echo "Удаляем $TAG (id=$RID)..."
          curl -sL -X DELETE \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${OUR_REPO}/releases/${RID}"
          sleep 2

      - name: Re-publish compressed after refresh
        if: steps.build.outputs.refresh_latest == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: compressed
          name: ${{ steps.build.outputs.rolling_name }}
          body_path: release-body-rolling.md
          files: out/latest/*
          fail_on_unmatched_files: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
