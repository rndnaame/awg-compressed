name: Compress AWG + sing-box

on:
  schedule:
    - cron: "0 */8 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compress:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y upx-ucl curl wget jq

      - name: Check versions and compress if needed
        id: build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          MIRROR="http://repo.hoaxisr.ru"
          OUR_REPO="${{ github.repository }}"
          TAG="compressed"
          OUT="out"
          mkdir -p "$OUT" work

          echo "Workflow: version-check enabled | repo=$OUR_REPO tag=$TAG"
          echo "skip=false" >> "$GITHUB_OUTPUT"

          upx_fast() {
            f="$1"
            echo "  UPX: $(basename "$f") ($(du -h "$f" | awk '{print $1}')) ..."
            if timeout 240 upx -9 --lzma --force "$f" 2>&1; then
              echo "  OK lzma: $(du -h "$f" | awk '{print $1}')"
              return 0
            fi
            echo "  lzma timeout/fail → пробуем -9"
            if timeout 120 upx -9 --force "$f" 2>&1; then
              echo "  OK -9: $(du -h "$f" | awk '{print $1}')"
              return 0
            fi
            echo "  UPX не успел — оставляем без сжатия"
            return 0
          }

          echo ""
          echo "== Версии на зеркале =="
          : > /tmp/wanted.txt
          : > /tmp/wanted_src.txt

          for pair in "aarch64-k3.10|aarch64-3.10-kn" "mipsel-k3.4|mipsel-3.4-kn" "mips-k3.4|mips-3.4-kn"; do
            path="${pair%%|*}"
            suffix="${pair##*|}"
            ipk=$(curl -sL "$MIRROR/$path/" | grep -oE "awg-manager_[0-9][^\"'<> ]+_${suffix}\\.ipk" | sort -V | tail -1 || true)
            if [ -z "$ipk" ]; then
              echo "  skip mirror $path"
              continue
            fi
            want="${ipk%.ipk}_compressed.ipk"
            echo "  IPK: $ipk  =>  $want"
            echo "$want" >> /tmp/wanted.txt
            echo "ipk|$path|$ipk|$want" >> /tmp/wanted_src.txt
          done

          sb_ver=$(curl -sL "$MIRROR/singbox/" | grep -oE 'href="1\.[^"/]+/"' | sed 's/href="//;s|/"||' | sort -V | tail -1 || true)
          echo "  sing-box ver: ${sb_ver:-none}"
          if [ -n "$sb_ver" ]; then
            for f in $(curl -sL "$MIRROR/singbox/$sb_ver/" | grep -oE 'singbox-[^"<> ]+' | grep -v sha256 | grep -E 'aarch64|mips' | sort -u); do
              want="${f}_compressed"
              echo "  SB:  $f  =>  $want"
              echo "$want" >> /tmp/wanted.txt
              echo "sb|$sb_ver|$f|$want" >> /tmp/wanted_src.txt
            done
          fi
          sort -u /tmp/wanted.txt -o /tmp/wanted.txt

          echo ""
          echo "== Ассеты в github.com/${OUR_REPO}/releases/tag/${TAG} =="
          : > /tmp/existing.txt

          API_URL="https://api.github.com/repos/${OUR_REPO}/releases/tags/${TAG}"
          API_JSON=$(curl -sL \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$API_URL" || true)

          if echo "$API_JSON" | jq -e '.assets' >/dev/null 2>&1; then
            echo "$API_JSON" | jq -r '.assets[].name' >> /tmp/existing.txt
            echo "  source: GitHub API (jq assets[].name)"
          else
            echo "  API не дал assets, пробуем expanded_assets HTML..."
            HTML=$(curl -sL "https://github.com/${OUR_REPO}/releases/expanded_assets/${TAG}" || true)
            echo "$HTML" | grep -oE 'releases/download/[^"]+' | sed 's|.*/||' >> /tmp/existing.txt || true
            echo "  source: expanded_assets HTML"
          fi

          grep -v '^$' /tmp/existing.txt | sort -u > /tmp/existing.sorted
          mv /tmp/existing.sorted /tmp/existing.txt

          if [ -s /tmp/existing.txt ]; then
            while read -r n; do echo "  • $n"; done < /tmp/existing.txt
          else
            echo "  (пусто — релиза нет или ассеты не прочитались)"
          fi

          echo ""
          echo "== Сравнение =="
          : > /tmp/todo.txt
          NEED=0
          while read -r want; do
            [ -n "$want" ] || continue
            if grep -qxF "$want" /tmp/existing.txt; then
              echo "  SKIP (уже в релизе): $want"
            else
              echo "  BUILD (нет в релизе): $want"
              echo "$want" >> /tmp/todo.txt
              NEED=1
            fi
          done < /tmp/wanted.txt

          if [ "$NEED" -eq 0 ]; then
            echo ""
            echo ">>> Все актуальные версии уже в релизе. Скачивание/сжатие не нужно."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo ""
          echo ">>> Будут собраны только отсутствующие файлы."
          echo "skip=false" >> "$GITHUB_OUTPUT"

          echo ""
          echo "== Сборка =="
          while IFS='|' read -r kind a b want; do
            [ -n "$want" ] || continue
            grep -qxF "$want" /tmp/todo.txt || continue

            if [ "$kind" = "ipk" ]; then
              path="$a"
              ipk="$b"
              echo "IPK download+compress: $ipk"
              wget -q -O "work/$ipk" "$MIRROR/$path/$ipk"
              rm -rf work/repack
              mkdir -p work/repack/control work/repack/data
              (
                cd work/repack
                tar -xzf "../$ipk"
                tar -xzf control.tar.gz -C control 2>/dev/null || true
                tar -xzf data.tar.gz -C data 2>/dev/null || true
                find data -type f -executable 2>/dev/null | while read -r f; do
                  head2=$(head -c 2 "$f" 2>/dev/null || true)
                  [ "$head2" = "#!" ] && continue
                  timeout 120 upx -9 --lzma "$f" 2>/dev/null || timeout 60 upx -9 "$f" 2>/dev/null || true
                done
                tar -czf control.tar.gz -C control .
                tar -czf data.tar.gz -C data .
                echo "2.0" > debian-binary
                tar -czf "../../$OUT/$want" debian-binary control.tar.gz data.tar.gz
              )
              ls -lh "$OUT/$want"
            elif [ "$kind" = "sb" ]; then
              sb_ver="$a"
              f="$b"
              echo "SB download+compress: $f"
              wget -q -O "work/$f" "$MIRROR/singbox/$sb_ver/$f"
              cp "work/$f" "$OUT/$want"
              chmod +x "$OUT/$want"
              upx_fast "$OUT/$want"
              ls -lh "$OUT/$want"
            fi
          done < /tmp/wanted_src.txt

          echo ""
          echo "== out/ =="
          ls -lh "$OUT" || true
          if ! ls "$OUT"/* >/dev/null 2>&1; then
            echo "out пуст — skip publish"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish release
        if: steps.build.outputs.skip != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: compressed
          name: Compressed AWG + sing-box
          body: |
            Auto-built UPX-compressed packages.
            Sources: repo.hoaxisr.ru / hoaxisr/amnezia-box

            ## Установка на роутере

            ```sh
            curl -sL https://raw.githubusercontent.com/rndnaame/awg-compressed/main/install-compressed.sh | sh
            ```

            Меню: только awg-manager / только sing-box / оба.

            Без вопросов:
            ```sh
            INSTALL_AWG=1 INSTALL_SB=0 sh -c "$(curl -sL https://raw.githubusercontent.com/rndnaame/awg-compressed/main/install-compressed.sh)"
            INSTALL_AWG=0 INSTALL_SB=1 sh -c "$(curl -sL https://raw.githubusercontent.com/rndnaame/awg-compressed/main/install-compressed.sh)"
            ```
          files: out/*
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
