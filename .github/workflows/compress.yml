name: Compress AWG + sing-box

on:
  schedule:
    - cron: "0 */8 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compress:
    runs-on: ubuntu-latest
    # большой mips + UPX может занять время; лимит job по умолчанию 6ч
    timeout-minutes: 90
    steps:
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y upx-ucl curl wget

      - name: Download and compress
        run: |
          set -e
          MIRROR="http://repo.hoaxisr.ru"
          OUT="out"
          mkdir -p "$OUT" work

          # Быстрый UPX: без --best (он на 50–60 МБ mips может идти 30–60+ мин)
          # Сначала -9 --lzma (до 4 мин), иначе fallback -9, иначе оставляем как есть
          upx_fast() {
            f="$1"
            echo "  UPX: $(basename "$f") ($(du -h "$f" | awk '{print $1}')) ..."
            if timeout 240 upx -9 --lzma --force "$f" 2>&1; then
              echo "  OK lzma: $(du -h "$f" | awk '{print $1}')"
              return 0
            fi
            echo "  lzma timeout/fail → пробуем -9"
            if timeout 120 upx -9 --force "$f" 2>&1; then
              echo "  OK -9: $(du -h "$f" | awk '{print $1}')"
              return 0
            fi
            echo "  UPX не успел — оставляем без сжатия"
            return 0
          }

          echo "== IPK =="
          for pair in "aarch64-k3.10|aarch64-3.10-kn" "mipsel-k3.4|mipsel-3.4-kn" "mips-k3.4|mips-3.4-kn"; do
            path="${pair%%|*}"
            suffix="${pair##*|}"
            ipk=$(curl -sL "$MIRROR/$path/" | grep -oE "awg-manager_[0-9][^\"'<> ]+_${suffix}\\.ipk" | sort -V | tail -1 || true)
            if [ -z "$ipk" ]; then
              echo "skip $path"
              continue
            fi
            echo "IPK: $ipk"
            wget -q -O "work/$ipk" "$MIRROR/$path/$ipk"
            rm -rf work/repack
            mkdir -p work/repack/control work/repack/data
            (
              cd work/repack
              tar -xzf "../$ipk"
              tar -xzf control.tar.gz -C control 2>/dev/null || true
              tar -xzf data.tar.gz -C data 2>/dev/null || true
              find data -type f -executable 2>/dev/null | while read -r f; do
                head2=$(head -c 2 "$f" 2>/dev/null || true)
                if [ "$head2" = "#!" ]; then
                  continue
                fi
                # IPK-бинари меньше — можно чуть дольше, но без --best
                timeout 120 upx -9 --lzma "$f" 2>/dev/null || timeout 60 upx -9 "$f" 2>/dev/null || true
              done
              tar -czf control.tar.gz -C control .
              tar -czf data.tar.gz -C data .
              echo "2.0" > debian-binary
              tar -czf "../../$OUT/${ipk%.ipk}_compressed.ipk" debian-binary control.tar.gz data.tar.gz
            )
          done

          echo "== sing-box =="
          sb_ver=$(curl -sL "$MIRROR/singbox/" | grep -oE 'href="1\.[^"/]+/"' | sed 's/href="//;s|/"||' | sort -V | tail -1 || true)
          echo "sing-box version: $sb_ver"
          if [ -n "$sb_ver" ]; then
            # только архитектуры Entware (mips/mipsel/aarch64), без linux-amd64
            for f in $(curl -sL "$MIRROR/singbox/$sb_ver/" | grep -oE 'singbox-[^"<> ]+' | grep -v sha256 | grep -E 'aarch64|mips' | sort -u); do
              echo "sing-box: $f"
              wget -q -O "work/$f" "$MIRROR/singbox/$sb_ver/$f"
              cp "work/$f" "$OUT/${f}_compressed"
              chmod +x "$OUT/${f}_compressed"
              upx_fast "$OUT/${f}_compressed"
            done
          fi

          echo "== result =="
          ls -lh "$OUT"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: compressed
          name: Compressed AWG + sing-box
          body: |
            Auto-built UPX-compressed packages.
            Sources: repo.hoaxisr.ru / hoaxisr/amnezia-box

            ## Установка на роутере

            ```sh
            curl -sL https://raw.githubusercontent.com/rndnaame/awg-compressed/main/install-compressed.sh | sh
            ```

            Меню: только awg-manager / только sing-box / оба.
            Если уже установлено — спросит, переустанавливать ли.

            Без вопросов:
            ```sh
            INSTALL_AWG=1 INSTALL_SB=0 sh -c "$(curl -sL https://raw.githubusercontent.com/rndnaame/awg-compressed/main/install-compressed.sh)"
            INSTALL_AWG=0 INSTALL_SB=1 sh -c "$(curl -sL https://raw.githubusercontent.com/rndnaame/awg-compressed/main/install-compressed.sh)"
            ```
          files: out/*
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
